server:
  port: 8083

spring:
  config:
    import: optional:nacos:advisor-ai-platform-common.yaml
  application:
    name: rag-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yaml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:advisor_ai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-} spanId=%X{spanId:-} turnId=%X{turnId:-}]"

advisor:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  embedding:
    model: ${EMBEDDING_MODEL:bge-m3}
  rag:
    upload-dir: ${RAG_UPLOAD_DIR:uploads}
  jwt:
    secret: ${JWT_SECRET:${ADVISOR_JWT_SECRET:}}
    expiration: ${JWT_EXPIRE_MS:86400000}
