version: "3.9"

x-maven-build-args: &maven-build-args
  MAVEN_PROXY_HOST: ${MAVEN_PROXY_HOST:-http.docker.internal}
  MAVEN_PROXY_PORT: ${MAVEN_PROXY_PORT:-3128}

services:
  nacos:
    image: nacos/nacos-server:v2.4.2
    container_name: advisor-nacos
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: advisor-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: advisor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: advisor_ai
    ports:
      - "5432:5432"
    volumes:
      - backend_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d advisor_ai"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: advisor-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  zookeeper:
    platform: linux/amd64
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: advisor-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.1
    container_name: advisor-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ai-gateway:
    build:
      context: ./ai-gateway
      dockerfile: Dockerfile
    container_name: advisor-ai-gateway
    environment:
      APP_NAME: aigateway
      HTTP_ADDR: 0.0.0.0:8080
      MASTER_API_KEY: ${AI_GATEWAY_MASTER_API_KEY:?AI_GATEWAY_MASTER_API_KEY is required}
      REDIS_ADDR: redis://redis:6379
      RATE_LIMIT_PER_MIN: 120
      RATE_LIMIT_TENANT_PER_MIN: 240
      RATE_LIMIT_ROUTE_PER_MIN: 120
      RATE_LIMIT_MODEL_PER_MIN: 120
      RATE_LIMIT_WINDOW_MS: 60000
      PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-gpt-4.1-mini}
      PROVIDER_TIMEOUT_SEC: 60
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8090:8080"

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *maven-build-args
        SERVICE_NAME: auth-service
        SERVICE_PORT: 8081
    container_name: advisor-auth-service
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: advisor_ai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADVISOR_JWT_SECRET: ${ADVISOR_JWT_SECRET:?ADVISOR_JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      MEMORY_API_TOKEN: ${MEMORY_API_TOKEN:?MEMORY_API_TOKEN is required}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?AGENT_API_TOKEN is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *maven-build-args
        SERVICE_NAME: chat-service
        SERVICE_PORT: 8082
    container_name: advisor-chat-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: advisor_ai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADVISOR_JWT_SECRET: ${ADVISOR_JWT_SECRET:?ADVISOR_JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      MEMORY_API_TOKEN: ${MEMORY_API_TOKEN:?MEMORY_API_TOKEN is required}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?AGENT_API_TOKEN is required}
      AGENT_BASE_URL: http://agent-ts:8001
      TRACE_GATEWAY_BASE_URL: http://gateway:8080
      AI_GATEWAY_ENABLED: "false"
      AI_GATEWAY_BASE_URL: http://ai-gateway:8080
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_MASTER_API_KEY:?AI_GATEWAY_MASTER_API_KEY is required}
      AI_GATEWAY_MODEL: ${AI_PROVIDER_MODEL:-gpt-4.1-mini}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      PROMETHEUS_BASE_URL: http://prometheus:9090
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      ai-gateway:
        condition: service_started
      agent-ts:
        condition: service_started
    ports:
      - "8082:8082"
    volumes:
      - ./chat-service/target/chat-service-1.0.0-SNAPSHOT.jar:/app/app.jar

  rag-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *maven-build-args
        SERVICE_NAME: rag-service
        SERVICE_PORT: 8083
    container_name: advisor-rag-service
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: advisor_ai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADVISOR_JWT_SECRET: ${ADVISOR_JWT_SECRET:?ADVISOR_JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      MEMORY_API_TOKEN: ${MEMORY_API_TOKEN:?MEMORY_API_TOKEN is required}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?AGENT_API_TOKEN is required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    volumes:
      - rag_uploads:/app/uploads

  memory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *maven-build-args
        SERVICE_NAME: memory-service
        SERVICE_PORT: 8084
    container_name: advisor-memory-service
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: advisor_ai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADVISOR_JWT_SECRET: ${ADVISOR_JWT_SECRET:?ADVISOR_JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      MEMORY_API_TOKEN: ${MEMORY_API_TOKEN:?MEMORY_API_TOKEN is required}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?AGENT_API_TOKEN is required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.containers.internal:11434}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"

  agent-ts:
    build:
      context: ..
      dockerfile: agent-ts/Dockerfile
    container_name: advisor-agent-ts
    environment:
      AGENT_API_HOST: 0.0.0.0
      AGENT_API_PORT: 8001
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?AGENT_API_TOKEN is required}
      MEMORY_API_BASE_URL: http://memory-service:8084
      MEMORY_API_TOKEN: ${MEMORY_API_TOKEN:?MEMORY_API_TOKEN is required}
      RAG_API_BASE_URL: http://rag-service:8083
      RAG_API_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      MCP_TOOLS: ${MCP_TOOLS:-true}
      MCP_SERVERS: ${MCP_SERVERS:-student:http:http://student-service:8091/mcp/message}
      MCP_TOKEN_STUDENT: ${MCP_SERVER_TOKEN:?MCP_SERVER_TOKEN is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://www.codexapis.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
      DEBUG_STREAM: "true"
      OPENAI_TIMEOUT_SEC: ${OPENAI_TIMEOUT_SEC:-120}
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: ${AGENT_HTTP_PROXY:-http://192.168.112.1:33210}
      HTTPS_PROXY: ${AGENT_HTTPS_PROXY:-http://192.168.112.1:33210}
      http_proxy: ${AGENT_HTTP_PROXY:-http://192.168.112.1:33210}
      https_proxy: ${AGENT_HTTPS_PROXY:-http://192.168.112.1:33210}
      NO_PROXY: localhost,127.0.0.1,::1,postgres,nacos,redis,kafka,zookeeper,agent-ts,auth-service,chat-service,rag-service,memory-service,audit-service,risk-control-service,check-in-service,student-service,gateway,ai-gateway,prometheus,grafana
      no_proxy: localhost,127.0.0.1,::1,postgres,nacos,redis,kafka,zookeeper,agent-ts,auth-service,chat-service,rag-service,memory-service,audit-service,risk-control-service,check-in-service,student-service,gateway,ai-gateway,prometheus,grafana
    depends_on:
      postgres:
        condition: service_healthy
      memory-service:
        condition: service_started
      rag-service:
        condition: service_started
      student-service:
        condition: service_started
    ports:
      - "8001:8001"
    volumes:
      - rag_uploads:/app/uploads

  agent-indexer:
    build:
      context: ..
      dockerfile: agent-indexer/Dockerfile
    container_name: advisor-agent-indexer
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/advisor_ai
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      INDEXER_BATCH_SIZE: ${INDEXER_BATCH_SIZE:-10}
      INDEXER_CHUNK_SIZE: ${INDEXER_CHUNK_SIZE:-800}
      INDEXER_CHUNK_OVERLAP: ${INDEXER_CHUNK_OVERLAP:-120}
      INDEXER_EMBEDDING_BATCH_SIZE: ${INDEXER_EMBEDDING_BATCH_SIZE:-16}
      INDEXER_RETRY_BACKOFF_SEC: ${INDEXER_RETRY_BACKOFF_SEC:-5}
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
    volumes:
      - rag_uploads:/app/uploads

  audit-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *maven-build-args
        SERVICE_NAME: audit-service
        SERVICE_PORT: 8085
    container_name: advisor-audit-service
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: advisor_ai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADVISOR_JWT_SECRET: ${ADVISOR_JWT_SECRET:?ADVISOR_JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      MEMORY_API_TOKEN: ${MEMORY_API_TOKEN:?MEMORY_API_TOKEN is required}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?AGENT_API_TOKEN is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"

  risk-control-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *maven-build-args
        SERVICE_NAME: risk-control-service
        SERVICE_PORT: 8086
    container_name: advisor-risk-control-service
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: advisor_ai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADVISOR_JWT_SECRET: ${ADVISOR_JWT_SECRET:?ADVISOR_JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"

  check-in-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *maven-build-args
        SERVICE_NAME: check-in-service
        SERVICE_PORT: 8087
    container_name: advisor-check-in-service
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: advisor_ai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADVISOR_JWT_SECRET: ${ADVISOR_JWT_SECRET:?ADVISOR_JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8087:8087"

  student-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *maven-build-args
        SERVICE_NAME: student-service
        SERVICE_PORT: 8091
    container_name: advisor-student-service
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: advisor_ai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADVISOR_JWT_SECRET: ${ADVISOR_JWT_SECRET:?ADVISOR_JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      FEATURE_MCP_SERVER: "true"
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:?MCP_SERVER_TOKEN is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SERVER_PORT: 8091
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      check-in-service:
        condition: service_started
    ports:
      - "8091:8091"

  feedback-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *maven-build-args
        SERVICE_NAME: feedback-service
        SERVICE_PORT: 8092
    container_name: advisor-feedback-service
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: advisor_ai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADVISOR_JWT_SECRET: ${ADVISOR_JWT_SECRET:?ADVISOR_JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-ai-cqut}
      GITHUB_REPO: ${GITHUB_REPO:-advisor-ai-platform}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8092:8092"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *maven-build-args
        SERVICE_NAME: gateway
        SERVICE_PORT: 8080
    container_name: advisor-gateway
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADVISOR_JWT_SECRET: ${ADVISOR_JWT_SECRET:?ADVISOR_JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      RISK_CONTROL_SERVICE_URL: http://risk-control-service:8086
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      nacos:
        condition: service_healthy
      auth-service:
        condition: service_started
      chat-service:
        condition: service_started
      rag-service:
        condition: service_started
      memory-service:
        condition: service_started
      audit-service:
        condition: service_started
      student-service:
        condition: service_started
      risk-control-service:
        condition: service_started
      check-in-service:
        condition: service_started
      feedback-service:
        condition: service_started
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: advisor-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      gateway:
        condition: service_started
      auth-service:
        condition: service_started
      chat-service:
        condition: service_started
      rag-service:
        condition: service_started
      memory-service:
        condition: service_started
      audit-service:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.2
    container_name: advisor-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: advisor-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: advisor-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/containers/:/var/lib/containers:ro
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off --quiet --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: advisor-node-exporter
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro
    ports:
      - "9100:9100"

volumes:
  backend_pg_data:
  rag_uploads:
  prometheus_data:
  grafana_data:
