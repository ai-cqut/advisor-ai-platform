name: CI

on:
  push:
    branches: ["master", "refactor/**"]
  pull_request:
    branches: ["master", "refactor/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encoding-guard:
    name: Encoding Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect UTF-8 BOM in text sources
        shell: bash
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            bom=$(xxd -p -l 3 "$f" | tr -d '\n')
            if [ "$bom" = "efbbbf" ]; then
              echo "::error file=$f::UTF-8 BOM detected"
              found=1
            fi
          done < <(
            find agent-ts agent-core backend frontend scripts \
              \( -type d \( -name target -o -name .venv -o -name __pycache__ -o -name node_modules -o -name dist -o -name build \) -prune \) \
              -o \
              \( -type f \
                \( -name '*.py' -o -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.ts' -o -name '*.tsx' -o -name '*.json' -o -name '*.yml' -o -name '*.yaml' -o -name '*.java' \) \
                -print0 \)
          )
          if [ "$found" -ne 0 ]; then
            echo "BOM check failed."
            exit 1
          fi

      - name: Dry-run text cleanup guard
        shell: pwsh
        run: ./scripts/clean_text_encoding.ps1 -DryRun

  build-java:
    name: Java (Maven Build + Test)
    runs-on: ubuntu-latest
    needs: [encoding-guard]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build all modules
        run: mvn -q -DskipTests package

      - name: Run tests
        run: mvn -q test

  build-frontend:
    name: Frontend (Build)
    runs-on: ubuntu-latest
    needs: [encoding-guard]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  build-agent:
    name: Agent (TypeScript + Rust Build)
    runs-on: ubuntu-latest
    needs: [encoding-guard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent-ts/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Install Agent TypeScript dependencies
        working-directory: agent-ts
        run: npm ci

      - name: Check Agent TypeScript
        working-directory: agent-ts
        run: npm run check

      - name: Build Agent TypeScript
        working-directory: agent-ts
        run: npm run build

      - name: Run Agent contract tests
        working-directory: agent-ts
        run: npm run test:contracts

      - name: Check Rust formatting
        working-directory: agent-core
        run: cargo fmt --all -- --check

      - name: Check Rust core
        working-directory: agent-core
        run: cargo check

      - name: Build Rust debug core
        working-directory: agent-core
        run: cargo build

      - name: Test Rust core
        working-directory: agent-core
        run: cargo test

      - name: Build Rust release core
        working-directory: agent-core
        run: cargo build --release

      - name: Run Agent integration tests
        working-directory: agent-ts
        run: npm run test:integration

  agent-evaluation:
    name: Agent Evaluation (DeepEval)
    runs-on: ubuntu-latest
    needs: [build-agent]
    defaults:
      run:
        working-directory: agent-ts
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      EVAL_LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
      EVAL_LLM_BASE_URL: ${{ secrets.EVAL_LLM_BASE_URL }}
      EVAL_LLM_MODEL: ${{ secrets.EVAL_LLM_MODEL }}
      EVAL_CI_MIN_E2E_SCORE: "4"
      EVAL_CI_MIN_DEEPEVAL_SCORE: "0.7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent-ts/package-lock.json

      - name: Validate evaluation secrets
        shell: bash
        run: |
          if [ -z "${EVAL_LLM_API_KEY}" ] && [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::EVAL_LLM_API_KEY or OPENAI_API_KEY secret is required for agent evaluation"
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY}" ] && [ -n "${EVAL_LLM_API_KEY}" ]; then
            echo "OPENAI_API_KEY=${EVAL_LLM_API_KEY}" >> "$GITHUB_ENV"
          fi
          if [ -z "${OPENAI_BASE_URL}" ] && [ -n "${EVAL_LLM_BASE_URL}" ]; then
            echo "OPENAI_BASE_URL=${EVAL_LLM_BASE_URL}" >> "$GITHUB_ENV"
          fi
          if [ -z "${OPENAI_MODEL}" ] && [ -n "${EVAL_LLM_MODEL}" ]; then
            echo "OPENAI_MODEL=${EVAL_LLM_MODEL}" >> "$GITHUB_ENV"
          fi
          if [ -z "${EVAL_LLM_BASE_URL}" ] && [ -z "${OPENAI_BASE_URL}" ]; then
            echo "OPENAI_BASE_URL=https://api.openai.com/v1" >> "$GITHUB_ENV"
          fi
          if [ -z "${EVAL_LLM_MODEL}" ] && [ -z "${OPENAI_MODEL}" ]; then
            echo "OPENAI_MODEL=gpt-4.1-mini" >> "$GITHUB_ENV"
          fi

      - name: Install Agent TypeScript dependencies
        run: npm ci

      - name: Run agent evaluation gate
        run: npm run eval:ci

  e2e-chat:
    name: E2E Chat Drill (Gateway + Services + Agent)
    runs-on: ubuntu-latest
    needs: [build-java, build-frontend, build-agent, agent-evaluation]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: advisor_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d advisor_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      nacos:
        image: nacos/nacos-server:v2.4.2
        env:
          MODE: standalone
        ports:
          - 8848:8848
          - 9848:9848
          - 9849:9849
      jaeger:
        image: jaegertracing/all-in-one:1.57
        ports:
          - 4318:4318
      kafka:
        image: apache/kafka:3.7.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: advisor_ai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      JWT_SECRET: Y25FZHVDcXV0QWR2aXNvckFpUGxhdGZvcm1Bcm9va2llb2ZjbGFuZ3VhZ2U=
      JWT_EXPIRE_MS: 86400000
      MEMORY_API_TOKEN: arookieofc
      AGENT_API_TOKEN: arookieofc
      INTERNAL_SERVICE_TOKEN: arookieofc
      AGENT_BASE_URL: http://127.0.0.1:8001
      AGENT_TIMEOUT_MS: 600000
      DEBUG_STREAM: "false"

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/advisor_ai
      AGENT_MODE: api
      AGENT_API_HOST: 127.0.0.1
      AGENT_API_PORT: 8001
      MEMORY_API_BASE_URL: http://localhost:8080
      MEMORY_API_TIMEOUT_SEC: 30
      MEMORY_API_MAX_RETRIES: 2
      MEMORY_API_RETRY_BACKOFF_SEC: 0.3
      NACOS_SERVER_ADDR: 127.0.0.1:8848
      E2E_AUTH_BASE_URL: http://localhost:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318/v1/traces
      KAFKA_SERVERS: 127.0.0.1:9092
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      RATE_LIMIT_REQUESTS_PER_MINUTE: 1000

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_TEMPERATURE: 0.2
      OPENAI_TIMEOUT_SEC: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate LLM secrets
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY secret is required for e2e-chat"
            exit 1
          fi
          if [ -z "${OPENAI_BASE_URL}" ]; then
            echo "OPENAI_BASE_URL=https://api.openai.com/v1" >> "$GITHUB_ENV"
          fi
          if [ -z "${OPENAI_MODEL}" ]; then
            echo "OPENAI_MODEL=gpt-4o-mini" >> "$GITHUB_ENV"
          fi

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install agent TypeScript dependencies
        working-directory: agent-ts
        run: npm ci

      - name: Build agent TypeScript
        working-directory: agent-ts
        run: npm run build

      - name: Install backend modules to local m2
        shell: bash
        run: |
          cd backend
          mvn -q -DskipTests install

      - name: Wait for Nacos ready (HTTP + gRPC)
        shell: bash
        run: |
          set -e

          echo "Waiting Nacos HTTP (8848)..."
          for i in {1..90}; do
            if curl -fsS "http://localhost:8848/nacos/v1/console/health/liveness" >/dev/null; then
              echo "nacos http is ready"
              break
            fi
            if [ "$i" = "90" ]; then
              echo "nacos http not ready"
              exit 1
            fi
            sleep 2
          done

          echo "Waiting Nacos gRPC (9848)..."
          for i in {1..90}; do
            if (echo > /dev/tcp/127.0.0.1/9848) >/dev/null 2>&1; then
              echo "nacos grpc is ready"
              break
            fi
            if [ "$i" = "90" ]; then
              echo "nacos grpc not ready"
              exit 1
            fi
            sleep 2
          done

      - name: Wait for Kafka ready
        shell: bash
        run: |
          set -e
          echo "Waiting Kafka (9092)..."
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then
              echo "kafka is ready"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "kafka not ready"
              exit 1
            fi
            sleep 2
          done

      - name: Wait for Redis ready
        shell: bash
        run: |
          set -e
          echo "Waiting Redis (6379)..."
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1; then
              echo "redis is ready"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "redis not ready"
              exit 1
            fi
            sleep 1
          done

      - name: Start auth-service
        shell: bash
        run: |
          cd backend/auth-service
          nohup env SPRING_CLOUD_NACOS_DISCOVERY_IP=127.0.0.1 SPRING_CLOUD_NACOS_DISCOVERY_PORT=8081 ADVISOR_JWT_SECRET=${JWT_SECRET} mvn -q spring-boot:run > ../../auth-e2e.log 2>&1 &

      - name: Start chat-service
        shell: bash
        run: |
          cd backend/chat-service
          nohup env SERVER_PORT=8082 SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/advisor_ai SPRING_CLOUD_NACOS_DISCOVERY_IP=127.0.0.1 SPRING_CLOUD_NACOS_DISCOVERY_PORT=8082 ADVISOR_JWT_SECRET=${JWT_SECRET} mvn -q spring-boot:run > ../../chat-e2e.log 2>&1 &

      - name: Start audit-service
        shell: bash
        run: |
          cd backend/audit-service
          nohup env SPRING_CLOUD_NACOS_DISCOVERY_IP=127.0.0.1 SPRING_CLOUD_NACOS_DISCOVERY_PORT=8085 mvn -q spring-boot:run > ../../audit-e2e.log 2>&1 &

      - name: Start rag-service
        shell: bash
        run: |
          cd backend/rag-service
          nohup env SERVER_PORT=8083 SPRING_CLOUD_NACOS_DISCOVERY_IP=127.0.0.1 SPRING_CLOUD_NACOS_DISCOVERY_PORT=8083 ADVISOR_JWT_SECRET=${JWT_SECRET} mvn -q spring-boot:run > ../../rag-e2e.log 2>&1 &

      - name: Start memory-service
        shell: bash
        run: |
          cd backend/memory-service
          nohup env SERVER_PORT=8084 SPRING_CLOUD_NACOS_DISCOVERY_IP=127.0.0.1 SPRING_CLOUD_NACOS_DISCOVERY_PORT=8084 ADVISOR_JWT_SECRET=${JWT_SECRET} mvn -q spring-boot:run > ../../memory-e2e.log 2>&1 &

      - name: Start gateway
        shell: bash
        run: |
          cd backend/gateway
          nohup env SERVER_PORT=8080 ADVISOR_JWT_SECRET=${JWT_SECRET} RISK_CONTROL_SERVICE_URL=http://127.0.0.1:8086 mvn -q spring-boot:run > ../../gateway-e2e.log 2>&1 &

      - name: Start risk-control-service
        shell: bash
        run: |
          cd backend/risk-control-service
          nohup env SERVER_PORT=8086 SPRING_CLOUD_NACOS_DISCOVERY_IP=127.0.0.1 SPRING_CLOUD_NACOS_DISCOVERY_PORT=8086 ADVISOR_JWT_SECRET=${JWT_SECRET} KAFKA_SERVERS=127.0.0.1:9092 REDIS_HOST=127.0.0.1 REDIS_PORT=6379 mvn -q spring-boot:run > ../../risk-control-e2e.log 2>&1 &

      - name: Start agent (TypeScript + Rust)
        shell: bash
        run: |
          cd agent-ts
          nohup node dist/main.js > ../agent-e2e.log 2>&1 &

      - name: Wait for dependencies and health
        shell: bash
        run: |
          set -e

          echo "Waiting auth-service..."
          for i in {1..120}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/internal/health || true)
            if [ "$code" = "200" ]; then
              echo "auth-service is ready"
              break
            fi
            if [ "$i" = "120" ]; then
              echo "auth-service not ready (last http=$code)"
              echo "===== auth-e2e.log (tail 200) ====="
              tail -n 200 auth-e2e.log || true
              exit 1
            fi
            sleep 2
          done

          echo "Waiting chat-service..."
          for i in {1..120}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/actuator/health || true)
            if [ "$code" = "200" ]; then
              echo "chat-service is ready"
              break
            fi
            if [ "$((i % 15))" = "0" ]; then
              echo "chat-service not ready yet (http=$code, attempt=$i/120)"
              tail -n 20 chat-e2e.log || true
            fi
            if [ "$i" = "120" ]; then
              echo "chat-service not ready (last http=$code)"
              echo "===== chat-e2e.log (tail 200) ====="
              tail -n 200 chat-e2e.log || true
              exit 1
            fi
            sleep 2
          done

          echo "Waiting rag-service..."
          for i in {1..180}; do
            if curl -fsS http://localhost:8083/actuator/health >/dev/null; then
              echo "rag-service is ready"
              break
            fi
            if [ "$i" = "180" ]; then
              echo "rag-service not ready"
              echo "===== rag-e2e.log (tail 200) ====="
              tail -n 200 rag-e2e.log || true
              exit 1
            fi
            sleep 2
          done

          echo "Waiting memory-service..."
          for i in {1..180}; do
            if curl -fsS http://localhost:8084/actuator/health >/dev/null; then
              echo "memory-service is ready"
              break
            fi
            if [ "$i" = "180" ]; then
              echo "memory-service not ready"
              echo "===== memory-e2e.log (tail 200) ====="
              tail -n 200 memory-e2e.log || true
              exit 1
            fi
            sleep 2
          done

          echo "Waiting gateway..."
          for i in {1..120}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/internal/health || true)
            if [ "$code" = "200" ]; then
              echo "gateway is ready"
              break
            fi
            if [ "$i" = "120" ]; then
              echo "gateway not ready"
              exit 1
            fi
            sleep 2
          done

          echo "Waiting risk-control-service..."
          for i in {1..120}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8086/actuator/health || true)
            if [ "$code" = "200" ]; then
              echo "risk-control-service is ready"
              break
            fi
            if [ "$i" = "120" ]; then
              echo "risk-control-service not ready (last http=$code)"
              echo "===== risk-control-e2e.log (tail 200) ====="
              tail -n 200 risk-control-e2e.log || true
              exit 1
            fi
            sleep 2
          done

          echo "Warming gateway -> auth-service route..."
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/auth/__ready__ || true)
            if [ "$code" = "200" ] || [ "$code" = "400" ] || [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "404" ] || [ "$code" = "405" ]; then
              echo "gateway auth route is ready (http=$code)"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "gateway auth route not ready (last http=$code)"
              exit 1
            fi
            sleep 2
          done

          echo "Waiting agent..."
          for i in {1..120}; do
            if curl -fsS http://localhost:8001/health >/dev/null; then
              echo "agent is ready"
              break
            fi
            if [ "$i" = "120" ]; then
              echo "agent not ready"
              exit 1
            fi
            sleep 2
          done

      - name: Run chat e2e drill (full)
        run: node scripts/chat_e2e_drill.mjs full http://localhost:8080 http://127.0.0.1:8001

      - name: Run memory e2e drill (full)
        run: node scripts/memory_e2e_drill.mjs http://localhost:8080 http://localhost:8081

      - name: Run rag e2e drill
        run: node scripts/rag_e2e_drill.mjs http://localhost:8080 http://localhost:8081

      - name: Print logs on failure
        if: failure()
        shell: bash
        run: |
          echo "===== gateway-e2e.log (tail 300) ====="
          tail -n 300 gateway-e2e.log || true
          echo "===== auth-e2e.log (tail 300) ====="
          tail -n 300 auth-e2e.log || true
          echo "===== chat-e2e.log (tail 300) ====="
          tail -n 300 chat-e2e.log || true
          echo "===== rag-e2e.log (tail 300) ====="
          tail -n 300 rag-e2e.log || true
          echo "===== audit-e2e.log (tail 300) ====="
          tail -n 300 audit-e2e.log || true
          echo "===== memory-e2e.log (tail 300) ====="
          tail -n 300 memory-e2e.log || true
          echo "===== risk-control-e2e.log (tail 300) ====="
          tail -n 300 risk-control-e2e.log || true
          echo "===== agent-e2e.log (tail 300) ====="
          tail -n 300 agent-e2e.log || true

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chat-logs
          path: |
            gateway-e2e.log
            auth-e2e.log
            chat-e2e.log
            rag-e2e.log
            audit-e2e.log
            memory-e2e.log
            risk-control-e2e.log
            agent-e2e.log
